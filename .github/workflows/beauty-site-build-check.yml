name: Beauty Site Build Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beauty-site-build-check.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and record result
        shell: bash
        run: |
          set +e
          # Fresh production rebuild validation requested 2026-08-18 19:54 ET.
          npm run build > /tmp/build.log 2>&1
          CODE=$?
          tail -n 80 /tmp/build.log
          if [ "$CODE" -eq 0 ]; then
            printf '{"success":true,"exitCode":0}\n' > beauty-build-result.json
          else
            python3 - "$CODE" <<'PY'
import json,sys
log=open('/tmp/build.log',errors='ignore').read()[-5000:]
json.dump({'success':False,'exitCode':int(sys.argv[1]),'tail':log},open('beauty-build-result.json','w'))
PY
          fi
          exit 0
      - name: Save result
        shell: bash
        run: |
          git config user.name 'lionelite-build-bot'
          git config user.email 'info@lionelitebeauty.com'
          git add beauty-build-result.json
          git commit -m 'test: record Beauty build result' || exit 0
          git push

name: Beauty Email Health Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-health-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production email health
        shell: bash
        run: |
          set +e
          # Creates the fixed Beauty Resend domain if missing and reports DNS requirements.
          sleep 10
          STATUS=$(curl -LsS -o /tmp/health.json -w '%{http_code}' https://www.lionelitebeauty.com/api/email-health)
          if [ -s /tmp/health.json ]; then
            BODY=$(cat /tmp/health.json)
          else
            BODY='{}'
          fi
          printf '{"httpStatus":"%s","response":%s}\n' "$STATUS" "$BODY" > email-health-result.json
          cat email-health-result.json
          exit 0
      - name: Save safe diagnostic result
        shell: bash
        run: |
          git config user.name 'lionelite-qa-bot'
          git config user.email 'orders@lionelitebeauty.com'
          git add email-health-result.json
          git commit -m 'test: record Beauty email health result' || exit 0
          git push

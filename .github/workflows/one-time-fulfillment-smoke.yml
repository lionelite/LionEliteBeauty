name: One-Time Fulfillment Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fulfillment-smoke.yml'

permissions:
  contents: read

jobs:
  fulfillment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Full production Beauty admin lifecycle QA
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.lionelitebeauty.com'
          ORDER="LEB-ADMIN-QA-$(date +%s)"

          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo 'ADMIN_PASSWORD repository secret is missing'
            exit 2
          fi
          USERNAME="${ADMIN_USERNAME:-admin}"

          cat > /tmp/order.json <<JSON
          {
            "action":"create",
            "orderNumber":"$ORDER",
            "name":"Lion Elite QA Customer",
            "email":"gagoagos@gmail.com",
            "phone":"+1 (555) 010-2026",
            "address":"100 Luxury Test Blvd, Miami, FL 33131 — QA TEST / DO NOT SHIP",
            "items":[
              {"slug":"ghk-cu-serum","quantity":1},
              {"slug":"kpv-moisturizer","quantity":1}
            ],
            "paymentMethod":"zelle",
            "discountCode":"LION10"
          }
          JSON

          CREATE="$(curl -fsS "$BASE/api/orders" -H 'content-type: application/json' --data-binary @/tmp/order.json)"
          python3 - "$CREATE" "$ORDER" <<'PY'
          import json, sys
          obj=json.loads(sys.argv[1]); order=sys.argv[2]
          assert obj.get('success') is True, obj
          o=obj['order']
          assert o['orderNumber'] == order
          assert o['paymentStatus'] == 'pending'
          assert o['fulfillmentStatus'] == 'processing'
          assert o['paymentMethod'] == 'zelle'
          print('CREATE_OK')
          PY

          auth_post () {
            local action="$1"
            local extra="${2:-}"
            curl -fsS "$BASE/api/orders" \
              -H 'content-type: application/json' \
              --data-binary "{\"action\":\"$action\",\"username\":\"$USERNAME\",\"password\":\"$ADMIN_PASSWORD\",\"orderNumber\":\"$ORDER\"$extra}"
          }

          LIST="$(curl -fsS "$BASE/api/orders" -H 'content-type: application/json' --data-binary "{\"action\":\"list\",\"username\":\"$USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}")"
          python3 - "$LIST" "$ORDER" <<'PY'
          import json,sys
          obj=json.loads(sys.argv[1]); order=sys.argv[2]
          assert obj.get('authenticated') is True and obj.get('role') == 'admin', obj
          assert any(x.get('orderNumber') == order for x in obj.get('orders',[])), obj
          print('LIST_OK')
          PY

          PAID="$(auth_post mark-paid ',\"paymentReference\":\"QA-ZELLE-CONFIRMED\"')"
          python3 - "$PAID" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])['order']
          assert o['paymentStatus'] == 'paid', o
          print('MARK_PAID_OK')
          PY

          PACKED="$(auth_post update-fulfillment ',\"fulfillmentStatus\":\"packed\"')"
          python3 - "$PACKED" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])['order']
          assert o['fulfillmentStatus'] == 'packed', o
          print('PACKED_OK')
          PY

          SHIPPED="$(auth_post update-tracking ',\"carrier\":\"USPS\",\"trackingNumber\":\"QA-DO-NOT-SHIP-0001\"')"
          python3 - "$SHIPPED" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])['order']
          assert o['fulfillmentStatus'] == 'shipped', o
          assert o['trackingNumber'] == 'QA-DO-NOT-SHIP-0001', o
          assert o.get('trackingSentAt'), o
          print('SHIPPED_EMAIL_OK')
          PY

          DELIVERED="$(auth_post update-fulfillment ',\"fulfillmentStatus\":\"delivered\"')"
          python3 - "$DELIVERED" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])['order']
          assert o['fulfillmentStatus'] == 'delivered', o
          print('DELIVERED_OK')
          PY

          echo "FULL_ADMIN_LIFECYCLE_OK $ORDER"

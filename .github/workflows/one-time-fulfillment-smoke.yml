name: One-Time Fulfillment Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fulfillment-smoke.yml'

permissions:
  contents: read

jobs:
  fulfillment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Full production Beauty order and email QA
        shell: bash
        run: |
          set -euo pipefail
          # Post-deploy re-run: 2026-08-18
          BASE='https://www.lionelitebeauty.com'
          ORDER="LEB-FULL-QA-$(date +%s)"

          cat > /tmp/order.json <<JSON
          {
            "action": "create",
            "orderNumber": "$ORDER",
            "name": "Lion Elite QA Customer",
            "email": "gagoagos@gmail.com",
            "phone": "+1 (555) 010-2026",
            "address": "100 Luxury Test Blvd, Miami, FL 33131 — QA TEST / DO NOT SHIP",
            "items": [
              {"slug":"ghk-cu-serum","name":"GHK-Cu Intensive Serum","quantity":1,"price":69.99},
              {"slug":"ghk-cu-face-wash","name":"GHK-Cu Peptide Face Wash","quantity":1,"price":69.99},
              {"slug":"kpv-moisturizer","name":"KPV Recovery Moisturizer","quantity":1,"price":79.99},
              {"slug":"hydra-boost-body-wash","name":"Hydra Boost Body Wash","quantity":1,"price":49.99}
            ],
            "paymentMethod": "zelle",
            "discountCode": "LION10"
          }
          JSON

          CREATE="$(curl -fsS "$BASE/api/orders" -H 'content-type: application/json' --data-binary @/tmp/order.json)"
          python3 - "$CREATE" "$ORDER" <<'PY'
          import json, sys
          obj=json.loads(sys.argv[1]); order=sys.argv[2]
          assert obj.get('success') is True, obj
          saved=obj.get('order') or {}
          assert saved.get('orderNumber') == order, saved
          assert saved.get('fulfillmentStatus') == 'processing', saved
          assert saved.get('paymentMethod') == 'zelle', saved
          assert saved.get('paymentStatus') == 'pending', saved
          assert saved.get('discountCode') == 'LION10', saved
          assert len(saved.get('items') or []) == 4, saved
          assert saved.get('subtotal') == 269.96, saved
          assert saved.get('total') == 242.96, saved
          print('ORDER_CREATE_OK', order)
          PY

          cat > /tmp/email.json <<JSON
          {
            "type": "order",
            "orderNumber": "$ORDER",
            "name": "Lion Elite QA Customer",
            "email": "gagoagos@gmail.com",
            "phone": "+1 (555) 010-2026",
            "address": "100 Luxury Test Blvd, Miami, FL 33131 — QA TEST / DO NOT SHIP",
            "items": [
              {"name":"GHK-Cu Intensive Serum","quantity":1,"price":69.99},
              {"name":"GHK-Cu Peptide Face Wash","quantity":1,"price":69.99},
              {"name":"KPV Recovery Moisturizer","quantity":1,"price":79.99},
              {"name":"Hydra Boost Body Wash","quantity":1,"price":49.99}
            ],
            "paymentMethod": "zelle",
            "discountCode": "LION10",
            "skipAdmin": true
          }
          JSON

          SEND="$(curl -fsS "$BASE/api/send" -H 'content-type: application/json' --data-binary @/tmp/email.json)"
          python3 - "$SEND" "$ORDER" <<'PY'
          import json, sys
          obj=json.loads(sys.argv[1]); order=sys.argv[2]
          assert obj.get('success') is True, obj
          assert obj.get('orderNumber') == order, obj
          assert obj.get('total') == 242.96, obj
          print('CUSTOMER_EMAIL_OK', order)
          PY

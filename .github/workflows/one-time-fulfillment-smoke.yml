name: One-Time Fulfillment Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fulfillment-smoke.yml'

permissions:
  contents: read

jobs:
  fulfillment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise production Zelle order and confirmation email
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.lionelitebeauty.com'
          ORDER="LEB-EMAIL-QA-$(date +%s)"

          echo "Creating synthetic Zelle QA order: $ORDER"
          CREATE="$(curl -fsS "$BASE/api/orders" \
            -H 'content-type: application/json' \
            --data-binary "{\"action\":\"create\",\"orderNumber\":\"$ORDER\",\"name\":\"Alexander Ringfield\",\"email\":\"gagoagos@gmail.com\",\"phone\":\"3054573814\",\"address\":\"QA TEST - DO NOT SHIP\",\"items\":[{\"name\":\"GHK-Cu Intensive Serum\",\"quantity\":1,\"price\":69.99}],\"paymentMethod\":\"zelle\",\"discountCode\":\"None\"}")"
          python3 - "$CREATE" "$ORDER" <<'PY'
import json, sys
obj=json.loads(sys.argv[1]); order=sys.argv[2]
assert obj.get('success') is True, obj
saved=obj.get('order') or {}
assert saved.get('orderNumber') == order, saved
assert saved.get('fulfillmentStatus') == 'processing', saved
assert saved.get('total') == 69.99, saved
print('CREATE_OK', order)
PY

          echo 'Sending real customer confirmation through production email endpoint'
          SEND="$(curl -fsS "$BASE/api/send" \
            -H 'content-type: application/json' \
            --data-binary "{\"type\":\"order\",\"orderNumber\":\"$ORDER\",\"name\":\"Alexander Ringfield\",\"email\":\"gagoagos@gmail.com\",\"phone\":\"3054573814\",\"address\":\"QA TEST - DO NOT SHIP\",\"items\":[{\"name\":\"GHK-Cu Intensive Serum\",\"quantity\":1,\"price\":69.99}],\"paymentMethod\":\"zelle\",\"discountCode\":\"None\",\"skipAdmin\":true}")"
          python3 - "$SEND" "$ORDER" <<'PY'
import json, sys
obj=json.loads(sys.argv[1]); order=sys.argv[2]
assert obj.get('success') is True, obj
assert obj.get('orderNumber') == order, obj
assert obj.get('total') == 69.99, obj
print('EMAIL_OK', order)
PY
